<!DOCTYPE html>
<html>

<head>
    <title>Batch SVG to GLB Converter</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            background: #f4f4f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button,
        input {
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #02569B;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }

        .log-list {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <h2>Batch 3D Icon Baker</h2>
        <p>Select multiple SVGs to automatically convert and download them as optimized .glb files.</p>

        <input type="file" id="fileInput" multiple accept=".svg" /><br>
        <button id="processBtn" disabled>Process & Download All</button>

        <div id="status">Waiting for files...</div>
        <div id="log" class="log-list"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        // Enable button only when files are selected
        fileInput.addEventListener('change', () => {
            processBtn.disabled = fileInput.files.length === 0;
            statusDiv.innerText = `${fileInput.files.length} file(s) selected.`;
        });

        function logMessage(msg) {
            const p = document.createElement('div');
            p.innerText = msg;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll
        }

        // Wrap the loader in a Promise to process sequentially
        function processSingleSVG(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const scene = new THREE.Scene();
                const loader = new SVGLoader();

                loader.load(url, function (data) {
                    const group = new THREE.Group();
                    group.scale.y *= -1; // Flip SVG to match 3D coordinates

                    for (const path of data.paths) {
                        const material = new THREE.MeshStandardMaterial({
                            color: path.color,
                            side: THREE.DoubleSide
                        });

                        const shapes = SVGLoader.createShapes(path);
                        for (const shape of shapes) {
                            // const geometry = new THREE.ExtrudeGeometry(shape, {
                            //     depth: 20,
                            //     bevelEnabled: true,
                            //     bevelThickness: 2,
                            //     bevelSize: 1,
                            //     bevelSegments: 3
                            // });
                            const geometry = new THREE.ExtrudeGeometry(shape, {
                                depth: 10,           // Lowered the depth slightly for a cleaner look
                                bevelEnabled: false  // TURN THIS OFF to fix the broken outlines
                            });
                            const mesh = new THREE.Mesh(geometry, material);
                            group.add(mesh);
                        }
                    }

                    // Center the 3D model
                    new THREE.Box3().setFromObject(group).getCenter(group.position).multiplyScalar(-1);
                    scene.add(group);

                    // Export to GLB
                    const exporter = new GLTFExporter();
                    exporter.parse(
                        scene,
                        function (gltf) {
                            // Trigger download
                            const blob = new Blob([gltf], { type: 'application/octet-stream' });
                            const downloadUrl = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.style.display = 'none';
                            link.href = downloadUrl;

                            // Name the file based on the original SVG name (e.g., react.svg -> react.glb)
                            const baseName = file.name.replace(/\.svg$/i, '');
                            link.download = `${baseName}.glb`;

                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);

                            // Cleanup memory
                            URL.revokeObjectURL(downloadUrl);
                            URL.revokeObjectURL(url);
                            resolve();
                        },
                        function (error) {
                            console.error('Export error:', error);
                            reject(error);
                        },
                        { binary: true }
                    );
                }, undefined, function (error) {
                    reject(error);
                });
            });
        }

        // Handle the batch processing
        processBtn.addEventListener('click', async () => {
            const files = Array.from(fileInput.files);
            processBtn.disabled = true;
            fileInput.disabled = true;
            logDiv.innerHTML = ''; // Clear logs

            statusDiv.innerText = "Processing started... please wait.";

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                logMessage(`[${i + 1}/${files.length}] Converting ${file.name}...`);

                try {
                    await processSingleSVG(file);
                    logMessage(`✅ Successfully downloaded ${file.name.replace('.svg', '.glb')}`);
                    // Small pause so the browser has time to trigger the download prompt sequentially
                    await new Promise(r => setTimeout(r, 500));
                } catch (err) {
                    logMessage(`❌ Failed to convert ${file.name}`);
                    console.error(err);
                }
            }

            statusDiv.innerText = "All files processed!";
            processBtn.disabled = false;
            fileInput.disabled = false;
        });
    </script>
</body>

</html>
