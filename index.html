<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Portfolio</title>
  <style>
    :root {
      --coin-bg: rgba(0, 0, 0, 0.03);       /* light mode default */
      --coin-border: rgba(0, 0, 0, 0.05);   /* light mode default */
    }
    body {
      margin: 0;
      background-color: #e0f7fa; /* Light mode background */
    }
    .initial-loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: #e0f7fa;
    }
    .loader {
      position: relative;
      width: 120px;
      height: 90px;
      margin: 0 auto;
    }
    .loader:before {
      content: "";
      position: absolute;
      bottom: 30px;
      left: 50px;
      height: 30px;
      width: 30px;
      border-radius: 50%;
      background: #0097a7; /* Darker Theme Cyan */
      animation: loading-bounce 0.5s ease-in-out infinite alternate;
    }
    .loader:after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      height: 7px;
      width: 45px;
      border-radius: 4px;
      box-shadow: 0 5px 0 #475569, -35px 50px 0 #475569, -70px 95px 0 #475569; /* Slate gray platforms */
      animation: loading-step 1s ease-in-out infinite;
    }

    @keyframes loading-bounce {
      0% { transform: scale(1, 0.7)}
      40% { transform: scale(0.8, 1.2)}
      60% { transform: scale(1, 1)}
      100% { bottom: 140px }
    }
    @keyframes loading-step {
      0% {
        box-shadow: 0 10px 0 rgba(0,0,0,0),
                    0 10px 0 #475569,
                  -35px 50px 0 #475569,
                  -70px 90px 0 #475569;
      }
      100% {
        box-shadow: 0 10px 0 #475569,
                  -35px 50px 0 #475569,
                  -70px 90px 0 #475569,
                  -70px 90px 0 rgba(0,0,0,0);
      }
    }
  </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader-container">
        <span class="loader"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
